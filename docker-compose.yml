services:
  mongodb:
    image: mongo:7
    container_name: rulebuilder-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-dynamic_rule_builder}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rulebuilder-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - mongodb

volumes:
  mongo_data:
